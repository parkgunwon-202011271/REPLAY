<meta charset="utf-8">
<title>리플 레이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Gothic+A1:wght@800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<div class="app" id="app">
  <div class="map" id="map" role="application" aria-label="파급 지도. 가운데가 사건, 바깥 고리로 갈수록 1차·2차·3차 파급"></div>

  <!-- 지도 위: 연결 종류 레이어 -->
  <div class="layers" id="layers" role="toolbar" aria-label="지도에 보일 연결 종류"></div>

  <!-- 왼쪽 패널 -->
  <aside class="side" id="side" aria-label="검색과 목록">
    <div class="side__head">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 26 26" aria-hidden="true">
          <circle cx="13" cy="13" r="12" fill="none" stroke="var(--color-accent)" stroke-width="1.6" opacity=".35"/>
          <circle cx="13" cy="13" r="7.5" fill="none" stroke="var(--color-accent)" stroke-width="1.8" opacity=".7"/>
          <circle cx="13" cy="13" r="3.4" fill="var(--color-harm)"/>
        </svg>
        <span class="brand__name">리플 레이더</span>
        <span class="brand__tag">공시로 그린 기업 파급 지도</span>
      </div>
      <div class="search" id="search">
        <label class="search__box">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="sr-only">기업 또는 사건 검색</span>
          <input class="search__input" id="q" type="search" autocomplete="off" placeholder="기업·사건 검색 (예: 동진쎄미켐)" role="combobox" aria-expanded="false" aria-controls="suggest">
          <button class="search__clear" id="qclear" type="button" aria-label="검색어 지우기" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </label>
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-event" aria-controls="pane-event" aria-selected="true">사건</button>
        <button class="tab" role="tab" id="tab-radar" aria-controls="pane-radar" aria-selected="false">미반영 <span class="tab__count num" id="radarCount">0</span></button>
        <button class="tab" role="tab" id="tab-watch" aria-controls="pane-watch" aria-selected="false">관심 기업</button>
      </div>
    </div>
    <div class="side__body" id="sideBody">
      <section class="pane" id="pane-event" role="tabpanel" aria-labelledby="tab-event"></section>
      <section class="pane" id="pane-radar" role="tabpanel" aria-labelledby="tab-radar" hidden></section>
      <section class="pane" id="pane-watch" role="tabpanel" aria-labelledby="tab-watch" hidden></section>
    </div>
  </aside>

  <!-- 기업 상세 -->
  <aside class="detail" id="detail" aria-label="기업 상세" hidden></aside>

  <button class="fab panel-toggle" id="panelToggle" type="button" aria-label="목록 패널 접기" aria-expanded="true">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- 범례 -->
  <details class="legend" id="legend" open>
    <summary>
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      범례
    </summary>
    <div class="legend__grid">
      <span class="legend__mark" style="background:var(--color-harm)"></span><span>피해 예상 · 주가에 반영됨</span>
      <span class="legend__mark" style="background:var(--color-gain)"></span><span>수혜 예상 · 주가에 반영됨</span>
      <span class="legend__mark" style="background:var(--color-surface);box-shadow:inset 0 0 0 3px var(--color-watch)"></span><span>아직 반영 안 됨</span>
      <span class="legend__mark" style="background:var(--color-odd)"></span><span>예상과 반대로 움직임</span>
      <span class="legend__mark" style="background:var(--color-external);border-radius:4px"></span><span>비상장·해외·공공</span>
      <span class="legend__road" style="border-color:var(--road-major)"></span><span>납품(공급계약)</span>
      <span class="legend__road" style="border-color:var(--road-minor-casing)"></span><span>투자(제3자배정)</span>
      <span class="legend__road" style="border-color:var(--road-rail);border-top-style:dashed"></span><span>지분 5% 이상</span>
      <span class="legend__road" style="border-color:var(--road-trail);border-top-width:2px;border-top-style:dotted"></span><span>경쟁·동조(주가)</span>
      <span class="legend__road" style="border-color:var(--route)"></span><span>선택한 파급 경로</span>
    </div>
  </details>

  <!-- 확대·축소 -->
  <div class="controls">
    <button class="fab" id="fit" type="button" aria-label="사건 전체 보기" title="사건 전체 보기">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="zoom">
      <button class="fab" id="zin" type="button" aria-label="확대"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="fab" id="zout" type="button" aria-label="축소"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <!-- 시간 재생 -->
  <div class="timebar" id="timebar">
    <button class="play" id="play" type="button" aria-label="주가 반응 재생">
      <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
    </button>
    <div class="timebar__day"><span class="timebar__d" id="dlabel">D+0</span><span class="timebar__date" id="dateLabel">—</span></div>
    <div class="timebar__track">
      <label class="sr-only" for="day">사건 뒤 거래일</label>
      <input id="day" type="range" min="0" max="60" value="0" step="1">
      <div class="timebar__ticks" aria-hidden="true"><span>사건일</span><span>D+20</span><span>D+40</span><span>D+60</span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="app.js"></script>
